# ─── Remove .php extension from all pages ────────────────────────────────────
location / {
    try_files $uri $uri.html $uri/ @extensionless-php;
    index index.html index.htm index.php;
}

# ─── Locale-prefixed URLs (production i18n: /es/blogs, /es/faq, …) ───────────
# Internal rewrite only — browser URL stays prefixed.

location ~ ^/([a-z]{2})/blogs/([a-zA-Z0-9\-_]+)$ {
    rewrite ^/([a-z]{2})/blogs/([a-zA-Z0-9\-_]+)$ /blogs.php?article=$2&lang=$1 last;
}

location ~ ^/([a-z]{2})/authors/([a-zA-Z0-9\-_]+)$ {
    rewrite ^/([a-z]{2})/authors/([a-zA-Z0-9\-_]+)$ /authors.php?author=$2&lang=$1 last;
}

location ~ ^/([a-z]{2})/authors/?$ {
    rewrite ^/([a-z]{2})/authors/?$ /authors.php?lang=$1 last;
}

location ~ ^/([a-z]{2})/blogs/?$ {
    rewrite ^/([a-z]{2})/blogs/?$ /blogs.php?lang=$1 last;
}

location ~ ^/([a-z]{2})/(faq|contact|download|terms-of-services|privacy-policy-ios|privacy-policy-android|claim-reward)$ {
    rewrite ^/([a-z]{2})/(.+)$ /$2.php?lang=$1 last;
}

location ~ ^/([a-z]{2})/?$ {
    rewrite ^/([a-z]{2})/?$ /index.php?lang=$1 last;
}

location @extensionless-php {
    rewrite ^(.*)$ $1.php last;
}

# ─── Blog clean URLs ──────────────────────────────────────────────────────────
# Redirect old query-param URLs to clean path (301 = SEO-safe permanent redirect)
# /blogs.php?article=some-slug  →  /blogs/some-slug
location = /blogs.php {
    if ($arg_article != "") {
        return 301 /blogs/$arg_article;
    }
    # No article param → show blog list (blogs.php with no args)
    try_files $uri =404;
}

# Rewrite clean blog URLs to the PHP handler internally (no browser redirect)
# /blogs/some-slug  →  /blogs.php?article=some-slug  (internal, URL stays clean)
location ~ ^/blogs/([a-zA-Z0-9\-_]+)$ {
    rewrite ^/blogs/([a-zA-Z0-9\-_]+)$ /blogs.php?article=$1 last;
}

location ~ ^/authors/([a-zA-Z0-9\-_]+)$ {
    rewrite ^/authors/([a-zA-Z0-9\-_]+)$ /authors.php?author=$1 last;
}

# ─── PHP handler (must come after rewrite rules) ─────────────────────────────
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php-fpm.sock; # adjust to your PHP-FPM socket
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}