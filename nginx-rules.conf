# --- Internationalization (production: /{lang}/path prefixes) ---
# Default locale (en) stays unprefixed. PHP reads locale from REQUEST_URI
# ($request_uri is unchanged by internal rewrites). Two-letter prefix matches any
# locale registered in config.php without nginx changes when adding languages.

# Canonical: strip default-locale prefix /en to unprefixed
rewrite ^/en/?$ / permanent;
rewrite ^/en/(.*)$ /$1 permanent;

# Locale-prefixed blogs: /es/blogs/slug -> blogs.php?article=slug
rewrite ^/([a-z][a-z])/blogs/(.+)$ /blogs.php?article=$2 last;

# Locale-prefixed authors: /es/authors/slug -> authors.php?author=slug
rewrite ^/([a-z][a-z])/authors/(.+)$ /authors.php?author=$2 last;

# Locale home: /es -> index.php
rewrite ^/([a-z][a-z])/?$ /index.php last;

# Strip locale prefix for extensionless pages: /es/faq -> /faq (-> faq.php via @extensionless-php)
rewrite ^/([a-z][a-z])/(.+)$ /$2 last;

# External Redirect: /blogs.php?article=slug -> /blogs/slug
if ($arg_article) {
    return 301 /blogs/$arg_article;
}

# Internal Rewrite: /blogs/slug -> /blogs.php?article=slug
rewrite ^/blogs/(.+)$ /blogs.php?article=$1 last;

# External Redirect: /authors.php?author=slug -> /authors/slug
if ($arg_author) {
    return 301 /authors/$arg_author;
}

# Authors directory index (/authors, /authors/) — must run before slug rule;
# physical authors/ folder on disk otherwise returns 403 Forbidden
rewrite ^/authors/?$ /authors.php last;

# Internal Rewrite: /authors/slug -> /authors.php?author=slug
rewrite ^/authors/(.+)$ /authors.php?author=$1 last;

# Redirect /privacy-policy.html -> /privacy-policy-android.php
location = /privacy-policy.html {
    return 301 /privacy-policy-android.php;
}

# Redirect /privacy-policy/apple.html -> /privacy-policy-ios.php
location = /privacy-policy/apple.html {
    return 301 /privacy-policy-ios.php;
}

location / {
    try_files $uri $uri.html $uri/ @extensionless-php;
    index index.html index.htm index.php;
}

location ~ \.php$ {
    try_files $uri =404;
    # ... your fastcgi_pass and parameters ...
}

location @extensionless-php {
    rewrite ^(.*)$ $1.php last;
}
